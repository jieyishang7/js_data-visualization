<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510"><rect width="1080" height="510" fill="#f3f4ed"/><g font-family="Arial,sans-serif" fill="#203e3b"><text x="30" y="40" font-size="24">Three ways to explore penguin measurements</text><text x="30" y="68" font-size="13">Concept sketches — illustrative marks, not computed results</text><rect x="30" y="94" width="325" height="380" rx="10" fill="#fffefa" stroke="#cbd5ca"/><text x="48" y="126" font-size="18">01 / Body-size explorer</text><text x="48" y="152" font-size="13">Relationship · implemented</text><path d="M80 200 V380 H330" fill="none" stroke="#526961"/><rect x="385" y="94" width="325" height="380" rx="10" fill="#fffefa" stroke="#cbd5ca"/><text x="403" y="126" font-size="18">02 / Mass distributions</text><text x="403" y="152" font-size="13">Comparison · proposed</text><path d="M435 200 V380 H685" fill="none" stroke="#526961"/><rect x="740" y="94" width="325" height="380" rx="10" fill="#fffefa" stroke="#cbd5ca"/><text x="758" y="126" font-size="18">03 / Island sample profile</text><text x="758" y="152" font-size="13">Sampling coverage · proposed</text><path d="M790 200 V380 H1040" fill="none" stroke="#526961"/><g fill="#247b78"><circle cx="96" cy="350" r="5"/><circle cx="105" cy="321" r="5"/><circle cx="123" cy="337" r="5"/><circle cx="146" cy="310" r="5"/><circle cx="153" cy="292" r="5"/><circle cx="174" cy="311" r="5"/><circle cx="190" cy="274" r="5"/></g><g fill="#745895"><rect x="217" y="268" width="8" height="8"/><rect x="222" y="245" width="8" height="8"/><rect x="240" y="253" width="8" height="8"/><rect x="259" y="230" width="8" height="8"/><rect x="279" y="218" width="8" height="8"/><rect x="292" y="205" width="8" height="8"/></g><text x="128" y="403" font-size="13">Flipper length (mm)</text><text transform="translate(53,320) rotate(-90)" font-size="13">Body mass (g)</text><text x="48" y="439" font-size="12">Filter species / year; inspect a point.</text><path d="M475 270